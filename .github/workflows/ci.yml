# The code's check on GitHub: one job named test on every pull request to dev and to main.
# It reads the code and holds no secret.
name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.12
          enable-cache: false
      # The strategy runner's sandbox: Ubuntu keeps unprivileged user namespaces from it unless this says otherwise.
      - run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv run --locked pytest
